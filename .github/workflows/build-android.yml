name: Build Wear OS APK
# Repo pubblico dal 15/09/2026 (storia ripulita); i secret di firma KEYSTORE_PASS, KEY_ALIAS, KEY_PASS e
# RELEASE_KEYSTORE_BASE64 vengono da watchface/release-keystore-credentials.txt e release.jks.

on:
  push:
    branches: [main, master, feature/**]
    paths: ['core/**', 'wear/**', 'mobile/**', 'gradle/**', 'contract/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/build-android.yml']
  workflow_dispatch:
    inputs:
      record:
        description: "Registra gli snapshot Paparazzi (wear/src/test/snapshots) e li carica come artifact"
        type: boolean
        default: false

# Un solo run per ramo: un push e un avvio a mano a pochi secondi di distanza caricavano due APK da 47 MB (17/09: quota
# storage di Actions al 100 %). L'ultimo arrivato cancella il precedente; i run con record=true hanno un gruppo loro.
concurrency:
  group: build-${{ github.ref }}-${{ github.event.inputs.record == 'true' && 'record' || 'apk' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # Il default di `packages` è «tools platform-tools», e «tools» è sparito dall'archivio dell'SDK il 14/09/2026 sera:
      # sdkmanager usciva con 1 («Failed to find package 'tools'»), sia con v3 sia con v4. Solo platform-tools; il resto
      # dell'SDK lo scarica Gradle.
      - uses: android-actions/setup-android@v4
        with: { packages: 'platform-tools' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'core/build.gradle.kts', 'wear/build.gradle.kts') }}
          restore-keys: gradle-
      - name: Unit tests
        run: ./gradlew :core:testDebugUnitTest --console=plain
      - name: Screenshot tests (Paparazzi, verify)
        if: hashFiles('wear/src/test/snapshots/**') != '' && github.event.inputs.record != 'true'
        run: ./gradlew :wear:verifyPaparazziDebug --console=plain
      - name: Screenshot tests (Paparazzi, record)
        if: github.event.inputs.record == 'true'
        run: ./gradlew :wear:recordPaparazziDebug --console=plain
      - name: Upload snapshots
        if: github.event.inputs.record == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-snapshots
          path: wear/src/test/snapshots
          retention-days: 30
      - name: Debug APKs
        run: ./gradlew :wear:assembleDebug :mobile:assembleDebug --console=plain
      - name: Restore keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.jks
      - name: Release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: ./gradlew :wear:assembleRelease --console=plain -x lint -x test
      - uses: actions/upload-artifact@v4
        with:
          name: cmwatch-apk
          path: |
            wear/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/release/*.apk
            mobile/build/outputs/apk/debug/*.apk
          # 47 MB a build: con 30 giorni la quota Actions (0,5 GB-mese) finiva in pochi giorni di push. L'APK si scarica subito.
          retention-days: 1
