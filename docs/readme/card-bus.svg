<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" xml:space="preserve">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151a33"/><stop offset="1" stop-color="#0a0e1c"/></linearGradient>
  <marker id="m" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="#3ddc84"/></marker></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><text x="70" y="100" fill="#ffffff" font-size="52" font-weight="800" text-anchor="start">Your PC, your Firebase, your wrist.</text><text x="70" y="146" fill="#b9c7e8" font-size="26" font-weight="500" text-anchor="start">End to end encrypted: Firebase only stores blobs</text><rect x="70" y="200" width="320" height="280" rx="14" fill="#0b1020" stroke="#ff8c42"/><text x="96" y="242" fill="#ff8c42" font-size="24" font-weight="800" text-anchor="start">your PC</text><text x="96" y="284" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">claude-master plugin</text><text x="96" y="316" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">cm-relay.py:</text><text x="96" y="348" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">  push the state</text><text x="96" y="380" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">  run the commands</text><text x="96" y="412" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">  from the watch</text><line x1="396" y1="320" x2="432" y2="320" stroke="#3ddc84" stroke-width="3" marker-end="url(#m)"/><line x1="432" y1="360" x2="396" y2="360" stroke="#3ddc84" stroke-width="3" marker-end="url(#m)"/><rect x="440" y="200" width="320" height="280" rx="14" fill="#0b1020" stroke="#ffd43b"/><text x="466" y="242" fill="#ffd43b" font-size="24" font-weight="800" text-anchor="start">your Firebase</text><text x="466" y="284" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">Realtime Database</text><text x="466" y="316" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">+ Cloud Messaging</text><text x="466" y="348" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">AES-256-GCM blobs,</text><text x="466" y="380" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">rules: only paired</text><text x="466" y="412" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">devices read</text><line x1="766" y1="320" x2="802" y2="320" stroke="#3ddc84" stroke-width="3" marker-end="url(#m)"/><line x1="802" y1="360" x2="766" y2="360" stroke="#3ddc84" stroke-width="3" marker-end="url(#m)"/><rect x="810" y="200" width="320" height="280" rx="14" fill="#0b1020" stroke="#3ddc84"/><text x="836" y="242" fill="#3ddc84" font-size="24" font-weight="800" text-anchor="start">your watch</text><text x="836" y="284" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">this app</text><text x="836" y="316" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">key in the Keystore</text><text x="836" y="348" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">paired over X25519</text><text x="836" y="380" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">with a 6-digit code</text><text x="836" y="412" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">from the PC</text><text x="70" y="530" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">state, events and outcomes go up; answers, prompts and launches come back</text><text x="70" y="592" fill="#9aa7c7" font-size="20" font-weight="500" text-anchor="start">no server of ours in between: bring your own Firebase project</text></svg>