<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" xml:space="preserve">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2a2a"/><stop offset="1" stop-color="#08161a"/></linearGradient>
  <marker id="m" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="#3ddc84"/></marker></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><text x="70" y="100" fill="#ffffff" font-size="52" font-weight="800" text-anchor="start">claude-master, on your wrist.</text><text x="70" y="146" fill="#b9c7e8" font-size="26" font-weight="500" text-anchor="start">The Wear OS app of the claude-master plugin</text><rect x="70" y="196" width="500" height="336" rx="14" fill="#0b1a1a" stroke="#2f6b55"/><text x="96" y="234" fill="#b9e8d0" font-size="20" font-weight="700" text-anchor="start">1  on your PC: the plugin</text><text x="96" y="266" fill="#9ad1ff" font-size="15" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ claude plugin marketplace add \</text><text x="96" y="288" fill="#9ad1ff" font-size="15" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">    frsorrentino/claude-master</text><text x="96" y="310" fill="#9ad1ff" font-size="15" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ claude plugin install \</text><text x="96" y="332" fill="#9ad1ff" font-size="15" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">    claude-master@claude-master-dev</text><text x="96" y="378" fill="#b9e8d0" font-size="20" font-weight="700" text-anchor="start">2  your Firebase: the relay</text><text x="96" y="410" fill="#9ad1ff" font-size="15" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ claude-master relay pair</text><text x="96" y="456" fill="#b9e8d0" font-size="20" font-weight="700" text-anchor="start">3  on the watch: the 6-digit code</text><text x="96" y="490" fill="#9aa7c7" font-size="17" font-weight="500" text-anchor="start">then every session, on the wrist</text><circle cx="679" cy="350" r="92" fill="#1b1f2a" stroke="#3a4152" stroke-width="3"/><rect x="767" y="328" width="12" height="44" rx="5" fill="#3a4152"/><clipPath id="clip679350"><circle cx="679" cy="350" r="74"/></clipPath><image x="605" y="276" width="148" height="148" xlink:href="sessions.png" clip-path="url(#clip679350)"/><text x="679" y="470" fill="#9aa7c7" font-size="16" font-weight="500" text-anchor="middle">the sessions</text><circle cx="884" cy="350" r="92" fill="#1b1f2a" stroke="#3a4152" stroke-width="3"/><rect x="972" y="328" width="12" height="44" rx="5" fill="#3a4152"/><clipPath id="clip884350"><circle cx="884" cy="350" r="74"/></clipPath><image x="810" y="276" width="148" height="148" xlink:href="question.png" clip-path="url(#clip884350)"/><text x="884" y="470" fill="#9aa7c7" font-size="16" font-weight="500" text-anchor="middle">a question</text><circle cx="1089" cy="350" r="92" fill="#1b1f2a" stroke="#3a4152" stroke-width="3"/><rect x="1177" y="328" width="12" height="44" rx="5" fill="#3a4152"/><clipPath id="clip1089350"><circle cx="1089" cy="350" r="74"/></clipPath><image x="1015" y="276" width="148" height="148" xlink:href="card.png" clip-path="url(#clip1089350)"/><text x="1089" y="470" fill="#9aa7c7" font-size="16" font-weight="500" text-anchor="middle">a session's card</text><text x="70" y="592" fill="#9aa7c7" font-size="20" font-weight="500" text-anchor="start">no Wear OS watch? claude-master works without the app: Telegram, any phone</text></svg>