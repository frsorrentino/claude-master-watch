<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=412">
<style>
:root{--bg:#000;--surface:#23272E;--low:#1B1F26;--high:#292F3A;--line:#2A2E35;--text:#F2F4F7;--text2:#98A2B3;--icon:#A8C7FA;--primary:#D3E3FD;--onp:#0A2050;--warn:#FFB020;--gone:#FF453A;--mono:'DejaVu Sans Mono',monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 'DejaVu Sans',Roboto,sans-serif;width:412px}
.tag{font:13px var(--mono);letter-spacing:.14em;color:var(--warn);padding:18px 20px 8px;display:flex;align-items:center;gap:10px}.tag:after{content:'';flex:1;height:1px;background:#5A4210}
.card{background:var(--surface);border-radius:22px;margin:0 12px 10px;padding:14px 8px 14px 16px}
.h{display:flex;align-items:flex-start;gap:12px}.h .t{flex:1;min-width:0}.ti{font-size:17px;font-weight:600;line-height:1.35}.sub{color:var(--text2);font-size:14.5px;margin-top:2px}
.mark{flex:none;width:18px;height:18px;border:2px solid var(--text2);margin-top:4px}.mark.p{border-radius:50%}.mark.a{border-radius:5px}
.chev{flex:none;width:36px;height:36px;display:grid;place-items:center;color:var(--text2);margin-top:-6px}
.detail{margin:10px 10px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:15px}
svg{display:block}
/* A: barra di icone */
.tool{display:flex;justify-content:space-between;margin:14px 8px 0 0}.tb{display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;font-size:12.5px;color:var(--text)}.tb i{width:48px;height:48px;border-radius:16px;background:var(--high);display:grid;place-items:center;color:var(--icon)}.tb.do i{background:var(--primary);color:var(--onp)}.tb.on i{background:#3A4A66;color:var(--primary)}
.refl{color:var(--icon);font-size:14.5px;margin:14px 0 0;display:flex;gap:6px;align-items:center}
/* B: due livelli */
.big{margin:14px 8px 0 0;background:var(--primary);color:var(--onp);border-radius:999px;height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.sec{display:flex;gap:8px;margin:10px 8px 0 0}.sec span{flex:1;height:44px;border-radius:999px;background:var(--high);color:var(--primary);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:15px}
.links{display:flex;flex-wrap:wrap;gap:4px 18px;margin:14px 8px 0 2px;font-size:14.5px;color:var(--icon)}.links .r{color:var(--gone)}
/* C: split + icone */
.split{display:flex;gap:2px;margin:14px 8px 0 0;align-items:center}.split .m{background:var(--primary);color:var(--onp);height:48px;border-radius:24px 6px 6px 24px;padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:600}.split .d{background:var(--primary);color:var(--onp);height:48px;width:44px;border-radius:6px 24px 24px 6px;display:grid;place-items:center}.split .sp{flex:1}.ib{width:48px;height:48px;border-radius:50%;background:var(--high);display:grid;place-items:center;color:var(--icon);margin-left:8px}
.menu{margin:10px 8px 0 0;background:var(--low);border-radius:16px;padding:6px 0}.menu div{display:flex;align-items:center;gap:14px;padding:10px 16px;font-size:15px}.menu div svg{color:var(--icon)}.menu .r{color:var(--gone)}.menu .r svg{color:var(--gone)}
.cap{position:fixed;left:0;right:0;bottom:0;background:#10131A;border-top:1px solid var(--line);padding:12px 16px 16px;font-size:14px;color:var(--text2)}.cap b{color:var(--text);font-size:15px;display:block;margin-bottom:2px}
</style></head><body><div id="r"></div>
<script>
const V=(location.hash||'#a').slice(1)
const ic={
 play:'<path d="M8 5v14l11-7z" fill="currentColor"/>',
 moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
 chat:'<path d="M20 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
 clock:'<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 more:'<circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/>',
 bot:'<rect x="5" y="8" width="14" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4v4M9 13h.01M15 13h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
 link:'<path d="M14 4h6v6M10 14L20 4M19 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 down:'<path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
 up:'<path d="M7 14l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
}
const s=(k,n=22)=>`<svg width="${n}" height="${n}" viewBox="0 0 24 24">${ic[k]}</svg>`
const head=(open)=>`<div class="h"><span class="mark p"></span><div class="t"><div class="ti">Revocare la chiave API Anthropic trovata in chiaro (maggio)</div><div class="sub">console.anthropic.com -&gt; API Keys</div></div><span class="chev">${s(open?'up':'down')}</span></div>`
const detail=`<div class="detail">La chiave è comparsa in chiaro in un file di maggio. Va revocata dalla console e sostituita nei progetti che la usano.</div>`
let actions=''
if(V==='a') actions=`<div class="tool"><span class="tb do"><i>${s('play')}</i>Fallo</span><span class="tb"><i>${s('moon')}</i>Stanotte</span><span class="tb"><i>${s('chat')}</i>Parlane</span><span class="tb"><i>${s('check')}</i>Fatto</span><span class="tb"><i>${s('more')}</i>Altro</span></div><div class="refl">${s('link',18)}Apri il riferimento</div>`
if(V==='b') actions=`<div class="big">${s('play',20)}Fallo</div><div class="sec"><span>${s('moon',20)}Stanotte</span><span>${s('chat',20)}Parlane</span></div><div class="links"><span>Fatto</span><span>Rimanda</span><span>Passa a Claude</span><span class="r">Rimuovi</span><span>Apri il riferimento ↗</span></div>`
if(V==='ac'||V==='ac2') actions=`<div class="tool"><span class="tb do"><i>${s('play')}</i>Fallo</span><span class="tb"><i>${s('moon')}</i>Stanotte</span><span class="tb"><i>${s('chat')}</i>Parlane</span><span class="tb"><i>${s('check')}</i>Fatto</span><span class="tb${V==='ac2'?' on':''}"><i>${s('more')}</i>Altro</span></div>`+(V==='ac2'?`<div class="menu"><div>${s('clock')}Rimanda</div><div>${s('bot')}Passa a Claude</div><div>${s('link')}Apri il riferimento</div><div class="r">${s('trash')}Rimuovi</div></div>`:'')
if(V==='c') actions=`<div class="split"><span class="m">${s('play',20)}Fallo</span><span class="d">${s('down',20)}</span><span class="sp"></span><span class="ib">${s('check')}</span><span class="ib">${s('clock')}</span></div><div class="menu"><div>${s('moon')}Stanotte</div><div>${s('chat')}Parlane con la master</div><div>${s('bot')}Passa a Claude</div><div>${s('link')}Apri il riferimento</div><div class="r">${s('trash')}Rimuovi</div></div>`
const caps={ac:['A + C · barra di icone, «Altro» chiuso','Le quattro azioni più usate a un tocco, uguali, con l\'etichetta sotto; «Fallo» pieno. «Altro» tiene le azioni rare.'],ac2:['A + C · «Altro» aperto','«Altro» apre qui sotto l\'elenco della C: Rimanda, Passa, il riferimento e Rimuovi in rosso. Un altro tocco lo richiude.'],a:['A · barra di icone (consiglio)','Cinque tasti uguali con l\'etichetta sotto, «Fallo» pieno. Rimanda, Passa e Rimuovi stanno in «Altro». Si legge in un colpo, come la barra delle app Google.'],b:['B · due livelli','«Fallo» a tutta larghezza, sotto Stanotte e Parlane tonali, in fondo le azioni di gestione come testo. Chiara la gerarchia, ma più alta.'],c:['C · tasto diviso','«Fallo ▾» del Material 3 Expressive: la freccia apre le altre azioni in elenco (qui aperto). A destra Fatto e Rimanda come icone tonde.']}
document.getElementById('r').innerHTML=`<div class="tag">ASPETTA TE · 16</div><div class="card">${head(true)}${detail}${actions}</div><div class="card"><div class="h"><span class="mark a"></span><div class="t"><div class="ti">17 client_id residui: 6 con candidato da confermare</div><div class="sub">.claude/da-decidere-client-id.md</div></div><span class="chev">${s('down')}</span></div></div><div class="cap"><b>${caps[V][0]}</b>${caps[V][1]}</div>`
</script></body></html>
