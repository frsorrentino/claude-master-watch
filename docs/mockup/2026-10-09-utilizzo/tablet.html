<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="base.css">
<style>
body{background:#000;width:1280px;height:800px;overflow:hidden;position:relative}
.cap{position:absolute;left:0;right:0;top:0;height:64px;padding:10px 20px;background:#0B0B0F;border-bottom:1px solid #2A2E35;display:flex;gap:16px;align-items:center}
.cap h2{font:600 13px/1.2 var(--mono);letter-spacing:.14em;color:var(--text);margin:0;white-space:nowrap}.cap p{margin:0;color:var(--text2);font-size:13px;line-height:1.35}
.desk{position:absolute;top:64px;left:0;right:0;bottom:0;display:flex}
.colh{width:400px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.scroll{flex:1;overflow:hidden;padding:4px 12px 0}
.wide{flex:1;padding:4px 16px 0;overflow:hidden;background-image:radial-gradient(rgb(255 255 255/.06) 1px,transparent 1px);background-size:22px 22px}
.grid{display:grid;gap:18px;padding:4px 16px 0;flex:1;overflow:hidden}
.panel h3{font:500 12px/1 var(--mono);letter-spacing:.14em;color:var(--text2);margin:12px 4px 10px;display:flex;gap:8px;align-items:center}.panel h3 i{flex:1;height:1px;background:var(--line)}
.handle{position:absolute;top:74px;width:28px;height:28px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--text2);font-size:14px}
</style></head><body>
<div class="cap" id="cap"></div><div class="desk" id="desk"></div>
<script src="lib.js"></script><script>
const v=new URLSearchParams(location.search).get('v')||'A'
const sess=`
<div class="grp" style="color:var(--warn)">TI ASPETTA · 1<i></i></div>
<div class="card sess"><div class="top"><span class="b" style="background:#2B5BD7">✋</span><span class="n">ledger-api</span><span class="m">ctx 62%</span></div><p style="color:var(--text)">Deploy ready, waiting for the client's ok. Deploy now?</p><div class="opts"><span>1 · yes</span><span>2 · no</span></div><div class="bar" style="margin-top:8px"><b style="width:62%"></b></div></div>
<div class="grp" style="color:var(--ring)">AL LAVORO · 1<i></i></div>
<div class="card sess"><div class="top"><span class="b" style="background:#1F8A4C">⚡</span><span class="n">atlas-shop</span><span class="m">ctx 61% · 5h 34%</span></div><p>migrations 008-011 applied, tests green. The seeds are still to review.</p><div class="bar"><b style="width:61%"></b></div></div>
<div class="grp" style="color:var(--good)">FERMA · 1<i></i></div>
<div class="card sess"><div class="top"><span class="b" style="background:#C9A400">⏸</span><span class="n">field-notes</span><span class="m">ctx 4%</span></div><p>README rewritten with the three sections asked for.</p><div class="bar"><b style="width:4%"></b></div></div>`
const recap=`
<div class="grp" style="color:var(--text)">AZIONI · 3<i></i></div>
<div class="chips"><span class="ach">Prova Stop dal telefono<small>atlas-shop</small></span><span class="ach">Seleziona stile master<small>recap 08/10</small></span><span class="ach">Rilascia la 2.4<small>ledger-api</small></span></div>
<div class="grp" style="color:var(--warn)">ASPETTA TE · 13<i></i></div>
<div class="ag"><i class="p"></i><div class="t"><b>Revocare la chiave API trovata in chiaro</b><small>console.anthropic.com</small></div><span class="do">Azioni</span></div>
<div class="ag"><i></i><div class="t"><b>Confermare i 6 client id con un candidato</b><small>.claude/to-decide-client-id.md</small></div><span class="do">Azioni</span></div>
<div class="grp" style="color:var(--icon)">PUÒ FARLO CLAUDE · 10<i></i></div>
<div class="ag"><i class="p"></i><div class="t"><b>Spostare il sito della documentazione</b><small>orbit-docs</small></div><span class="do">Azioni</span></div>
<div class="note2" style="margin:10px 4px">Tutto il recap ›</div>`
const util=quotaCard(P,360)+quotaCard(Wk,360)
const dock=`<div class="dock"><div class="row1"><span style="color:#F08A5D">✳</span><div style="flex:1"><div class="mono">MASTER · 15:09 · CTX 63%</div><b>riavvio pulito della master</b></div><span style="background:#26364E;border-radius:50%;width:34px;height:34px;display:grid;place-items:center">▶</span></div><div class="field">Scrivi alla master</div></div>`
const ql=`<div class="ql">○ 5h <span class="tr"><b></b></span> 34% · ▢ 5h <span class="tr"><b style="width:0"></b></span> vecchio</div>`
if(v==='A'){
  document.getElementById('cap').innerHTML=`<h2>A · HOME A TUTTA LARGHEZZA</h2><p>Senza colonne aperte la home prende lo schermo e mette le sezioni in tre colonne: Sessioni, Recap, Utilizzo. Al tocco su una sessione la home si stringe a sinistra (400 dp) e la sessione entra a destra; chiusa l'ultima colonna, la home si riallarga.</p>`
  document.getElementById('desk').innerHTML=`<div style="flex:1;display:flex;flex-direction:column"><div style="display:flex;align-items:center;gap:10px;padding:8px 20px 0;font-size:22px"><b style="font-weight:500">Master</b><span style="font-size:15px;color:var(--text2)">3 aperte</span><span style="flex:1"></span><span style="width:420px">${ql}</span></div>
  <div class="grid" style="grid-template-columns:1fr 1fr 1fr"><div class="panel"><h3>⌄ SESSIONI · 3<i></i></h3>${sess}</div><div class="panel"><h3>⌄ RECAP<i></i></h3>${recap}</div><div class="panel"><h3>⌄ UTILIZZO<i></i></h3>${util}${today(360)}</div></div>
  <div style="padding:0 16px">${dock}</div></div>`
} else {
  document.getElementById('cap').innerHTML=`<h2>B · COLONNA FISSA + CRUSCOTTO</h2><p>La colonna della home resta dov'è: Sessioni, Notte, Altro e la master. Senza colonne aperte, lo spazio a destra diventa il cruscotto: Recap e Utilizzo larghi, come pagine. Al tocco su una sessione cambia solo il lato destro: la lista non si muove.</p>`
  document.getElementById('desk').innerHTML=`<div class="colh"><div style="display:flex;align-items:center;gap:10px;padding:8px 16px 0;font-size:22px"><b style="font-weight:500">Master</b><span style="font-size:15px;color:var(--text2)">3 aperte</span></div><div style="padding:6px 12px 0">${ql}</div>
  <div class="scroll"><div class="panel"><h3>⌄ SESSIONI · 3<i></i></h3>${sess}<h3>› NOTTE<i></i></h3><h3>› ALTRO<i></i><small style="font:13px Roboto">Chiuse · 1</small></h3></div></div>${dock}</div>
  <div style="width:28px;flex:none;position:relative"><span class="handle" style="left:0;top:10px">⇄</span></div>
  <div class="grid" style="grid-template-columns:1fr 1fr;padding-left:14px"><div class="panel"><h3>RECAP<i></i></h3>${recap}</div><div class="panel"><h3>UTILIZZO<i></i></h3>${util}${today(360)}</div></div>`
}
</script></body></html>
