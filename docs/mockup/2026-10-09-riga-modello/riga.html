<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
:root{--bg:#000;--surface:#23272E;--low:#1B1F26;--high:#292F3A;--line:rgb(255 255 255/.10);--text:#F2F4F7;--text2:#B0B8C4;--icon:#A8C7FA;--primary:#D3E3FD;--onp:#0A2050;--warn:#FFB020;--ring:#7FA1FF;--track:#3A4150;--week:#C3A6F5;--mono:'Roboto Mono','DejaVu Sans Mono',monospace}
*{box-sizing:border-box}body{margin:0;background:#0B0B0F;color:var(--text);font:15px/1.45 Roboto,system-ui,sans-serif}
.board{display:grid;grid-template-columns:repeat(2,412px);gap:22px 24px;padding:20px}
.col h2{font:600 13px/1 var(--mono);letter-spacing:.14em;color:var(--text2);margin:0 0 6px}.cap{color:var(--text2);font-size:13px;margin:0 0 10px;min-height:56px}
.phone{background:var(--bg);border:1px solid #2A2E35;border-radius:24px;overflow:hidden;height:178px}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px 6px;font-size:20px}.bar .b{width:28px;height:28px;border-radius:8px;background:#B07A1E;display:grid;place-items:center;font-size:14px}.bar .sp{flex:1}
.row{display:flex;align-items:center;gap:8px;padding:2px 4px 8px 16px}
.pill{background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.pill small{color:var(--text2);font-size:11px}
.dots{width:40px;text-align:center;color:var(--text2);font-size:20px}
.ringm{display:inline-flex;align-items:center;gap:6px;font-size:15px}.ringm svg{flex:none}
.two{display:flex;flex-direction:column;line-height:1.15}.two small{color:var(--text2);font-size:12px}
.chat{border-top:1px solid var(--line);padding:12px 16px;color:var(--text2);font-size:14px}
.mbar{display:inline-flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--text2);white-space:nowrap}.mbar i{display:inline-block;width:46px;height:4px;border-radius:2px;background:var(--track);position:relative;overflow:hidden}.mbar i b{position:absolute;left:0;top:0;bottom:0;background:var(--ring)}
.chip{background:var(--surface);border-radius:999px;padding:7px 11px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.status{display:flex;gap:14px;align-items:center;padding:0 16px 10px;font:12px var(--mono);color:var(--text2)}.status b{color:var(--text);font-weight:500}
.warnc{color:var(--warn)}
</style></head><body><div class="board" id="b"></div>
<script>
const ring=(p,col,size=26,w=4)=>{const r=size/2-w/2,c=size/2,L=2*Math.PI*r;return `<svg width="${size}" height="${size}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#3A4150" stroke-width="${w}"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${L*p/100} ${L}" transform="rotate(-90 ${c} ${c})"/></svg>`}
const bar=`<div class="bar">‹ <span class="b">⚡</span><b style="font-weight:500">supervisor-app</b><span class="sp"></span>≡</div>`
const chat=`<div class="chat">Home web, check e test: 416 su 416 verdi.</div>`
const V=[
 ['OGGI','La pillola, poi due anelli con l\'etichetta accanto; l\'ora della quota va a capo e la riga diventa alta e sbilanciata.',
  `<div class="row"><span class="pill">Opus 5.5 · max ▾</span><span style="flex:1"></span><span class="ringm">${ring(4,'#7FA1FF')}<span class="two">5h 4%<small>⟳ 20:00</small></span></span><span class="ringm" style="margin-left:6px">${ring(74,'#A8C7FA')}ctx 74%</span><span class="dots">⋮</span></div>`],
 ['A · TRE PILLOLE UGUALI','Modello, quota e contesto come tre pillole della stessa altezza, ognuna si tocca; l\'anellino sta dentro la pillola, l\'ora della quota sulla stessa riga.',
  `<div class="row" style="gap:6px"><span class="chip">Opus 5.5 · max ▾</span><span class="chip">${ring(4,'#7FA1FF',16,3)}5h 4% · 20:00</span><span class="chip">${ring(74,'#A8C7FA',16,3)}ctx 74%</span><span style="flex:1"></span><span class="dots">⋮</span></div>`],
 ['B · BARRETTE COME IN HOME','La pillola del modello a sinistra; a destra due barrette sottili in monospazio come la riga della quota in home: 5h col reset, contesto colorato alle soglie.',
  `<div class="row"><span class="pill">Opus 5.5 · max ▾</span><span style="flex:1"></span><span style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><span class="mbar">5h <i><b style="width:4%"></b></i> 4% · 20:00</span><span class="mbar">ctx <i><b style="width:74%;background:#A8C7FA"></b></i> 74%</span></span><span class="dots">⋮</span></div>`],
 ['C · TESTATA PULITA + RIGA DI STATO','In testata solo la pillola del modello e ⋮. Sotto, una riga di stato in monospazio piccola: quota, ripartenza e contesto; il contesto diventa ambra sopra il 75%.',
  `<div class="row"><span class="pill">Opus 5.5 · max ▾</span><span style="flex:1"></span><span class="dots">⋮</span></div><div class="status"><span>5h <b>4%</b> · si azzera alle 20:00</span><span>ctx <b class="">74%</b></span></div>`],
]
document.getElementById('b').innerHTML=V.map(([t,c,h])=>`<div class="col"><h2>${t}</h2><p class="cap">${c}</p><div class="phone">${bar}${h}${chat}</div></div>`).join('')
</script></body></html>
